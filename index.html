<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Todo App</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="container">
    <h1>Todo App</h1>

    <section class="todo-input-row" aria-label="Add a todo">
      <input id="todoInput" type="text" placeholder="Enter a todo" aria-label="Todo text" />
      <button id="addTodoButton" type="button">Add</button>
    </section>

    <ul id="todoList" class="todo-list" aria-label="Todo list"></ul>
  </main>

  <script src="script.js"></script>
</body>
</html>
